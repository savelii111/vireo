[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vireo-editor"
version = "0.1.0"
description = "Vireo Editor — cuts content to target length honoring StyleDNA."
requires-python = ">=3.10"
dependencies = ["vireo-shared"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vireo_editor*"]
