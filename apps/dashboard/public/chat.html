<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vireo — Chat with your AI Creative Director</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/chat.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/chat.js" defer></script>
<body class="chat-page">
  <header class="header">
    <a href="/dashboard/" class="brand">
      <div class="logo">V</div>
      <div>
        <h1>Vireo</h1>
        <p class="tagline">Your AI Creative Director</p>
      </div>
    </a>
    <div class="header-actions">
      <a href="/projects.html" class="nav-link">Projects</a>
      <a href="/dashboard/" class="nav-link">Dashboard</a>
      <span class="status-pill" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Ready</span>
      </span>
    </div>
  </header>

  <main class="chat-main">
    <!-- Sidebar with conversation list -->
    <aside class="chat-sidebar" id="chat-sidebar">
      <div class="sidebar-head">
        <h2>Conversations</h2>
        <button class="btn btn-ghost" id="btn-new-conv" title="New conversation">+ New</button>
      </div>
      <div class="conv-list" id="conv-list">
        <div class="empty">Loading…</div>
      </div>
      <div class="sidebar-foot">
        <select id="project-select" class="select">
          <option value="">All projects</option>
        </select>
      </div>
    </aside>

    <!-- Main chat panel -->
    <section class="chat-panel">
      <div class="chat-header">
        <div>
          <div class="chat-title" id="chat-title">New conversation</div>
          <div class="chat-sub" id="chat-sub">Talk to your creative director</div>
        </div>
        <div class="chat-header-actions">
          <button class="btn btn-ghost" id="btn-save-content" title="Save last assistant reply as content" disabled>💾 Save</button>
          <button class="btn btn-ghost" id="btn-delete-conv" title="Delete conversation" disabled>🗑</button>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="welcome">
          <h2>Hey! I'm Vireo.</h2>
          <p>I can help you create projects, save your writing, analyze your style, cut long videos into short clips, and distribute across platforms.</p>
          <div class="suggestions">
            <button class="suggestion">Create a project called "YouTube Channel" for tech videos</button>
            <button class="suggestion">Show me my projects</button>
            <button class="suggestion">Save this text: "AI is changing how creators work. Three trends to watch: 1) personal style models, 2) auto-editing, 3) cross-platform distribution."</button>
            <button class="suggestion">Analyze my style DNA</button>
            <button class="suggestion">Cut this to 30 seconds for TikTok: [paste a transcript]</button>
          </div>
        </div>
      </div>

      <div class="composer">
        <textarea id="composer-input" placeholder="Talk to Vireo… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
        <button class="btn btn-primary" id="btn-send">Send</button>
      </div>
    </section>
  </main>

  <script src="/auth.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
