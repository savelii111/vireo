<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Vireo</title>
  <link rel="stylesheet" href="/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <a href="/" class="auth-brand">
      <div class="logo">V</div>
      <span>Vireo</span>
    </a>
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to your Vireo account</p>

      <form id="login-form">
        <label>
          <span>Email</span>
          <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" required placeholder="Your password" autocomplete="current-password">
        </label>
        <div class="form-error" id="form-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Log in →</button>
      </form>

      <div class="auth-divider">or</div>
      <p class="auth-alt">No account yet? <a href="/signup.html">Sign up</a></p>
    </div>
  </div>
  <script src="/auth.js"></script>
</body>
</html>
